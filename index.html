<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Mac Profile</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
  class="min-h-screen flex justify-center items-center p-6"
  style="
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 100;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    background: radial-gradient(circle at 30% 20%, #1c1c1e 0%, #000000 60%);
  "
>
  <div class="relative w-[320px]">
    <!-- Blur Glow Under Window -->
    <div class="absolute inset-0 translate-y-6 blur-3xl opacity-40 bg-white/20 rounded-3xl"></div>

    <!-- Mac Window 3:5 Ratio -->
    <div class="relative aspect-[3/5] rounded-2xl overflow-hidden bg-white/10 backdrop-blur-2xl border border-white/20 shadow-2xl flex flex-col">
      <!-- Mac Title Bar -->
      <div class="flex items-center gap-2 px-4 py-3 bg-white/10 border-b border-white/10">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
        <div class="w-3 h-3 rounded-full bg-green-500"></div>
      </div>

      <!-- Window Content -->
      <div class="flex-1 flex items-center justify-center p-10">
        <div class="flex flex-col items-center text-center">
          <!-- Simple Profile Vector -->
          <div class="h-24 w-24 mb-5 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md border border-white/30">
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c2.5-4 13.5-4 16 0" />
            </svg>
          </div>

          <h1
            class="text-2xl text-white/95 tracking-[0.02em]"
            style="font-family: Arial, Helvetica, sans-serif; font-weight: 700;"
          >
            HRITHU KRISHNA
          </h1>

          <p
            class="mt-4 text-sm max-w-sm text-blue-400/90 tracking-[0.015em]"
            style="font-family: Arial, Helvetica, sans-serif; font-weight: 300;"
          >
            Passionate about coding and building projets
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
